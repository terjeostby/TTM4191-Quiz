<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz for Eksamen</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f7f9fc;
      max-width: 700px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }
    h1 {
      text-align: center;
      color: #333;
      font-size: clamp(24px, 5vw, 36px);
      margin-bottom: 20px;
    }
    label {
      font-size: clamp(16px, 4vw, 18px);
      color: #000;
      margin-top: 10px;
      display: block;
    }
    select {
      font-size: clamp(16px, 4vw, 18px);
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      width: 100%;
      box-sizing: border-box;
    }
    button {
      background-color: #004894;
      color: white;
      border: none;
      padding: 10px;
      margin-top: 15px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      font-size: clamp(16px, 2vw, 18px);
      width: 100%;
    }
    button:hover {
      background-color: #0056b3;
    }
    .question {
      font-size: clamp(18px, 5vw, 22px);
      margin: 25px 0 15px 0;
      font-weight: 500;
      color: #222;
    }
    .option {
      background-color: #fff;
      color: #000;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      width: 100%;
      text-align: left;
      font-size: clamp(16px, 4.5vw, 18px);
    }
    .option:hover {
      background-color: #f1f1f1;
    }
    .option:disabled {
      opacity: 0.6;
      cursor: default;
    }
    #feedback, #score {
      font-weight: bold;
      font-size: clamp(16px, 4.5vw, 18px);
      margin-top: 20px;
      text-align: center;
    }
    #progress {
      margin-top: 10px;
      font-size: clamp(14px, 4vw, 16px);
      color: #555;
    }
    .flashcard-controls {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
      gap: 30px;
      align-items: center;
    }
    .flashcard {
      background: white;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      margin: 20px auto;
      text-align: center;
      perspective: 1000px;
      width: 100%;
      max-width: 400px;
      height: 400px;
      cursor: pointer;
      transition: transform 0.6s ease;
      position: relative;
    }
    .flashcard-inner {
      border-radius: 20px;
      overflow: hidden;
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }
    .flashcard.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }
    .flashcard-front, .flashcard-back {
      backface-visibility: hidden;
      position: absolute;
      width: 100%;
      height: 100%;
      padding: 30px;
      box-sizing: border-box;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: clamp(16px, 2vw, 20px);
      overflow-wrap: break-word;
      word-wrap: break-word;
      overflow: auto;
      background-color: white;
    }
    .flashcard-back {
      transform: rotateY(180deg);
      font-style: italic;
    }
  </style>
  <script>
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function shuffleQuestionOptions(question) {
      const originalOptions = question.options.map((opt, idx) => ({ text: opt, index: idx }));
      const shuffled = shuffleArray(originalOptions);
      question.options = shuffled.map(o => o.text);
      question.answer = shuffled.findIndex(o => o.index === question.answer);
      return question;
    }

    let questions = [], current = 0, score = 0, flashcardMode = false;

    function loadFromTheme(mode) {
      const selectedFile = document.getElementById('temaSelect').value;
      flashcardMode = mode === 'flashcard';
      fetch(selectedFile)
        .then(response => response.text())
        .then(text => {
          const lines = text.split('\n').map(line => line.trim()).filter(Boolean);
          questions = [];
          for (let i = 0; i < lines.length; i += 6) {
            const q = {
              question: lines[i],
              options: [lines[i+1], lines[i+2], lines[i+3], lines[i+4]],
              answer: parseInt(lines[i+5])
            };
            questions.push(shuffleQuestionOptions(q));
          }
          questions = shuffleArray(questions);
          current = 0; score = 0;
          document.getElementById("score").textContent = "";
          document.getElementById("quiz-container").style.display = flashcardMode ? "none" : "block";
          document.getElementById("flashcard-container").style.display = flashcardMode ? "block" : "none";
          if (flashcardMode) showFlashcard();
          else showQuestion();
        });
    }

    function showQuestion() {
      const q = questions[current];
      document.getElementById("question").textContent = q.question;
      document.getElementById("feedback").textContent = "";
      document.getElementById("nextBtn").style.display = "none";
      document.getElementById("progress").textContent = `Spørsmål ${current + 1} av ${questions.length}`;
      const optionsDiv = document.getElementById("options");
      optionsDiv.innerHTML = "";
      q.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.textContent = opt;
        btn.className = "option";
        btn.onclick = () => selectAnswer(i);
        optionsDiv.appendChild(btn);
      });
    }

    function selectAnswer(i) {
      const q = questions[current];
      const feedback = document.getElementById("feedback");
      if (i === q.answer) {
        feedback.textContent = "Riktig!";
        feedback.style.color = "green";
        score++;
      } else {
        feedback.textContent = `Feil! Riktig svar er: ${q.options[q.answer]}`;
        feedback.style.color = "red";
      }
      Array.from(document.getElementsByClassName("option")).forEach(btn => btn.disabled = true);
      document.getElementById("nextBtn").style.display = "inline";
    }

    function nextQuestion() {
      current++;
      if (current < questions.length) showQuestion();
      else {
        document.getElementById("quiz-container").style.display = "none";
        document.getElementById("score").textContent = `Du fikk ${score} av ${questions.length} riktige!`;
      }
    }

    function showFlashcard() {
      const q = questions[current];
      document.getElementById("flashcard-question").textContent = q.question;
      document.getElementById("flashcard-answer").textContent = q.options[q.answer];
      document.getElementById("flashcard-progress").textContent = `Kort ${current + 1} av ${questions.length}`;
      document.querySelector('.flashcard').classList.remove('flipped');
      document.getElementById("prevBtn").style.display = current === 0 ? 'none' : 'inline-block';
      document.getElementById("nextBtnFlash").style.display = current === questions.length - 1 ? 'none' : 'inline-block';
    }

    function nextFlashcard() {
      if (current < questions.length - 1) {
        current++;
        showFlashcard();
      }
    }

    function prevFlashcard() {
      if (current > 0) {
        current--;
        showFlashcard();
      }
    }

    function flipFlashcard(card) {
      card.classList.toggle('flipped');
    }
  </script>
</head>
<body>
  <h1>TTM4191 flervalg</h1>
  <label for="temaSelect">Velg tema:</label>
  <select id="temaSelect">
    <option value="TTM4191_Tema1_SmartGrid.txt">Smart Grid – definisjon, struktur og arkitektur</option>
    <option value="TTM4191_Tema2_Protokoller.txt">Kommunikasjonsprotokoller i Smart Grid</option>
    <option value="TTM4191_Tema3_Protokollstakk.txt">Internettarkitektur og protokollstakken</option>
    <option value="TTM4191_Tema4_Applikasjonslaget.txt">Applikasjonslaget (HTTP, DNS, SMTP, e-post, RTT)</option>
    <option value="TTM4191_Tema5_Transportlaget.txt">Transportlaget (TCP, UDP, flow control, congestion control, sockets)</option>
    <option value="TTM4191_Tema6_Nettverkslaget.txt">Nettverkslaget (IP, ruting, forwarding, CIDR, ARP, fragmentering)</option>
    <option value="TTM4191_Tema7_Linklaget.txt">Linklaget (Ethernet, MAC, CRC, ARP, framing, VLAN, CSMA/CD)</option>
    <option value="TTM4191_Tema8_Wireless.txt">Trådløse og mobile nettverk (Wi-Fi, 802.11, 5G, handover, RTS/CTS)</option>
    <option value="TTM4191_Tema9_Kryptografi.txt">Kryptografi og informasjonssikkerhet (hash, MAC, signatur, PGP, TLS, sertifikater)</option>
    <option value="TTM4191_Tema10_Blandet.txt">Blandede spørsmål fra hele faget</option>
  </select>
  <button onclick="loadFromTheme('quiz')">Start quiz</button>
  <button onclick="loadFromTheme('flashcard')">Flashcards</button>

  <div id="quiz-container" style="display:none;">
    <div id="progress"></div>
    <div class="question" id="question"></div>
    <div id="options"></div>
    <div id="feedback"></div>
    <button onclick="nextQuestion()" style="display:none;" id="nextBtn">Neste</button>
  </div>

  <div id="flashcard-container" style="display:none;">
    <div class="flashcard" onclick="flipFlashcard(this)">
      <div class="flashcard-inner">
        <div class="flashcard-front" id="flashcard-question"></div>
        <div class="flashcard-back" id="flashcard-answer"></div>
      </div>
    </div>
    <div class="flashcard-controls">
      <div style="flex: 1; text-align: left;">
        <button onclick="prevFlashcard()" id="prevBtn" style="font-size: 2.5rem; color: #004894; background: none; border: none; padding: 0; display: none;">←</button>
      </div>
      <div id="flashcard-progress" style="margin-top: 20px; font-size: clamp(14px, 4vw, 16px); color: #333; text-align: center; flex: 1;"></div>
      <div style="flex: 1; text-align: right;">
        <button onclick="nextFlashcard()" id="nextBtnFlash" style="font-size: 2.5rem; color: #004894; background: none; border: none; padding: 0; display: none;">→</button>
      </div>
    </div>
  </div>

  <div id="score"></div>
</body>
</html>
